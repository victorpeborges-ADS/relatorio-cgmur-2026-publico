name: Publicar edição do relatório histórico
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-cgmur-historico
  cancel-in-progress: false

jobs:
  history:
    if: ${{ github.event.issue.user.login == 'victorpeborges-ADS' && github.repository == 'victorpeborges-ADS/relatorio-cgmur-2026-publico' }}
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar relatório histórico após conferir autoria e conteúdo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'), zlib=require('node:zlib');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const owner='victorpeborges-ADS',repo='relatorio-cgmur-2026-publico';
          if(event.issue?.user?.login!==owner || event.repository?.full_name!==owner+'/'+repo)throw Error('Autoria ou repositório não autorizado');
          const marker='CGMUR_HISTORY_UPDATE_V1_GZIP\n',rawMarker='CGMUR_HISTORY_UPDATE_V1\n';
          const body=event.issue.body||'';
          if(!body.startsWith(marker)&&!body.startsWith(rawMarker)){console.log('Outra solicitação — ignorada');process.exit(0);}
          if(body.length>150000)throw Error('Solicitação muito grande');
          const json=body.startsWith(marker)?zlib.gunzipSync(Buffer.from(body.slice(marker.length).trim(),'base64url'),{maxOutputLength:120000}).toString('utf8'):body.slice(rawMarker.length).trim();
          if(json.length>120000 || /sei\.mi\.gov\.br|mcidades\.sharepoint\.com|\b\d{5}\.\d{6}\/\d{4}-\d{2}\b/i.test(json))throw Error('Limite de tamanho excedido ou referência interna incluída');
          const x=JSON.parse(json);
          const str=(v,max)=>typeof v==='string' && v.length<=max;
          for(const k of ['title','subtitle','period','summary'])if(!str(x[k],12000))throw Error('Texto inválido: '+k);
          if(!Array.isArray(x.years)||x.years.length!==4||!Array.isArray(x.debentures)||x.debentures.length!==4||!Array.isArray(x.themes)||x.themes.length>10||x.themes.length<4)throw Error('Séries históricas inválidas');
          const integer=(v)=>Number.isFinite(v)&&v>=0&&v<1e12;
          for(const y of x.years)if(!str(y.year,4)||!['2023','2024','2025','2026'].includes(y.year)||!['processes','generated','documents','external','notes','merits','tenMonthDocuments','analytical'].every(k=>integer(y[k]))||!['label','summary','actions','results'].every(k=>str(y[k],5000)))throw Error('Ano histórico inválido');
          for(const y of x.debentures)if(!['acts','projectValue','ceiling','plannedPoints','quantified','cases'].every(k=>integer(y[k]))||!str(y.year,4))throw Error('Linha financeira inválida');
          for(const t of x.themes)if(!['id','tag','title','action','result','evidence','boundary'].every(k=>str(t[k],9000)))throw Error('Tema institucional inválido');
          if(!x.territory || !['states','macroregions','procCases','proc2026','municipalTDU','favorable','proInvestment','proFinancing'].every(k=>integer(x.territory[k])))throw Error('Território inválido');
          if(!x.notes||!['comparability','limitations','attribution','sourceSEI','sourceSharePoint','sourceDeb','sourceProc'].every(k=>str(x.notes[k],12000)))throw Error('Ressalvas e fontes inválidas');
          const c=x.curadoria;
          const textKeys=['title','intro','financialHeadline','financialText','ceilingText','pointsText','qualityTitle','qualityText','siniduTitle','siniduText','visitsTitle','visitsText','sourceNote'];
          if(!c||!textKeys.every(k=>str(c[k],9000)))throw Error('Campos de curadoria inválidos');
          if(!Array.isArray(c.metrics)||c.metrics.length!==4||!c.metrics.every(m=>str(m.value,90)&&str(m.label,180)&&str(m.detail,700)))throw Error('Indicadores de curadoria inválidos');
          const sanitized={title:x.title,subtitle:x.subtitle,period:x.period,summary:x.summary,updated:new Date().toISOString().slice(0,10),highlights:x.highlights||[],years:x.years,debentures:x.debentures,themes:x.themes,territory:x.territory,notes:x.notes,curadoria:c};
          async function api(url,method='GET',data){
            const res=await fetch(url,{method,headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});
            if(!res.ok)throw Error('GitHub HTTP '+res.status+': '+(await res.text()).slice(0,300));
            return res.json();
          }
          (async()=>{
            const url='https://api.github.com/repos/'+owner+'/'+repo+'/contents/historico-2023-2026.json';
            const old=await api(url);
            await api(url,'PUT',{message:'Publicar atualização da edição histórica — solicitação #'+event.issue.number,content:Buffer.from(JSON.stringify(sanitized,null,2)+'\n').toString('base64'),sha:old.sha,branch:'main'});
            await api('https://api.github.com/repos/'+owner+'/'+repo+'/issues/'+event.issue.number,'PATCH',{state:'closed'});
            console.log('Edição histórica atualizada');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
