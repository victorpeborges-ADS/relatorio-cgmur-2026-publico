name: Publicar edição do relatório
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-cgmur-2026
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.issue.user.login == 'victorpeborges-ADS' && github.repository == 'victorpeborges-ADS/relatorio-cgmur-2026-publico' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validar edição e atualizar conteúdo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const owner='victorpeborges-ADS';
          const repo='relatorio-cgmur-2026-publico';
          const markerV1='CGMUR_REPORT_UPDATE_V1\n';
          const markerV2='CGMUR_REPORT_UPDATE_V2_GZIP\n';
          if(event.repository?.full_name!==owner+'/'+repo || event.issue?.user?.login!==owner) throw Error('Publicador não autorizado');
          const body=event.issue.body||'';
          if(!body.startsWith(markerV1)&&!body.startsWith(markerV2)) { console.log('Não é pedido de publicação; ignorado'); process.exit(0); }
          if(body.length>150000)throw Error('Solicitação excessiva');
          const raw=body.startsWith(markerV2)
            ?zlib.gunzipSync(Buffer.from(body.slice(markerV2.length).trim(),'base64url'),{maxOutputLength:120000}).toString('utf8')
            :body.slice(markerV1.length).trim();
          if(raw.length>120000) throw Error('Documento excede limite de tamanho');
          const data=JSON.parse(raw);
          const str=(v,max)=>typeof v==='string' && v.length<=max;
          if(!str(data.title,220)||!str(data.subtitle,300)||!str(data.summary,12000)||!str(data.caveats,12000)||!str(data.footer,12000)||!str(data.period,250)||!str(data.status,400)) throw Error('Campos textuais inválidos');
          if(!Array.isArray(data.metrics)||data.metrics.length>40||!Array.isArray(data.sections)||data.sections.length>80)throw Error('Quantidade de indicadores/seções inválida');
          if(!data.metrics.every(x=>str(x.id,100)&&str(x.value,100)&&str(x.label,500)))throw Error('Indicadores inválidos');
          if(!data.sections.every(x=>str(x.id,100)&&str(x.title,450)&&str(x.stage,250)&&str(x.body,24000)))throw Error('Seções inválidas');
          if(!Array.isArray(data.monthly)||data.monthly.length>24||!data.monthly.every(x=>str(x.label,50)&&Number.isInteger(x.value)&&x.value>=0&&x.value<=100000))throw Error('Série temporal inválida');
          if(!Array.isArray(data.documentTypes)||data.documentTypes.length>24||!data.documentTypes.every(x=>str(x.label,80)&&Number.isInteger(x.value)&&x.value>=0&&x.value<=100000))throw Error('Composição documental inválida');
          if(!str(data.tempoMedio,100)||!str(data.continuidade2026,30)||!str(data.continuidadeAnterior,30))throw Error('Indicadores adicionais inválidos');
          const textKeys=['dashboardTitle','dashboardSubtitle','monthlyTitle','monthlyCaption','mixTitle','mixCaption','statusTitle','statusCaption','continuityTitle','continuityCaption','findingsTitle'];
          if(!textKeys.every(k=>str(data[k],1200)))throw Error('Título ou legenda inválida');

          // Impede inclusão inadvertida dos identificadores nominais na versão pública.
          if(/sei\.mi\.gov\.br|mcidades\.sharepoint\.com|\b(?:\d{5}\.\d{6}\/\d{4}-\d{2})\b/i.test(raw))throw Error('Referência interna detectada; publicação recusada');
          data.updated=new Date().toISOString().slice(0,10);
          const safe={
            title:data.title,subtitle:data.subtitle,period:data.period,status:data.status,updated:data.updated,
            summary:data.summary,metrics:data.metrics,monthly:data.monthly,documentTypes:data.documentTypes,
            tempoMedio:data.tempoMedio,continuidade2026:data.continuidade2026,continuidadeAnterior:data.continuidadeAnterior,
            sections:data.sections,caveats:data.caveats,footer:data.footer,
            ...Object.fromEntries(textKeys.map(k=>[k,data[k]]))
          };
          const url='https://api.github.com/repos/'+owner+'/'+repo+'/contents/content.json';
          async function api(url,method='GET',body){
            const r=await fetch(url,{method,headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
            if(!r.ok)throw Error('GitHub API HTTP '+r.status+': '+(await r.text()).slice(0,400));
            return r.json();
          }
          (async()=>{
            const old=await api(url);
            const payload={
              message:'Atualizar relatório editado no site — edição autorizada #'+event.issue.number,
              content:Buffer.from(JSON.stringify(safe,null,2)+'\n','utf8').toString('base64'),
              sha:old.sha,branch:'main'
            };
            await api(url,'PUT',payload);
            console.log('Conteúdo atualizado com êxito.');
            await api('https://api.github.com/repos/'+owner+'/'+repo+'/issues/'+event.issue.number,'PATCH',{state:'closed'});
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
